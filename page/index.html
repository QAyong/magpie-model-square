<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>模型广场 · Models</title>
    <link rel="stylesheet" href="style.css">
    <script src="_magpie/bridge.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="heading-main">
          <img class="page-icon" src="icon.svg" alt="" width="24" height="24">
          <h1>模型广场</h1>
        </div>
        <div class="header-meta">
          <div class="header-controls">
            <div class="preference-segments" role="group" aria-label="模型布局">
              <button class="preference-button is-active" type="button" data-layout="grid" aria-label="卡片布局" title="卡片布局" aria-pressed="true">
                <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="3" y="3" width="5" height="5" rx=".7"></rect><rect x="12" y="3" width="5" height="5" rx=".7"></rect><rect x="3" y="12" width="5" height="5" rx=".7"></rect><rect x="12" y="12" width="5" height="5" rx=".7"></rect></svg>
              </button>
              <button class="preference-button" type="button" data-layout="list" aria-label="列表布局" title="列表布局" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="2.5" y="3" width="3.3" height="3.3" rx=".6"></rect><path d="M8 4.65h9.5"></path><rect x="2.5" y="8.35" width="3.3" height="3.3" rx=".6"></rect><path d="M8 10h9.5"></path><rect x="2.5" y="13.7" width="3.3" height="3.3" rx=".6"></rect><path d="M8 15.35h9.5"></path></svg>
              </button>
            </div>
            <div class="preference-segments" role="group" aria-label="外观主题">
              <button class="preference-button" type="button" data-theme-option="light" aria-label="浅色" title="浅色" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.2"></circle><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4m8.8 8.8 1.4 1.4m0-11.6-1.4 1.4m-8.8 8.8-1.4 1.4"></path></svg>
              </button>
              <button class="preference-button is-active" type="button" data-theme-option="system" aria-label="跟随系统" title="跟随系统" aria-pressed="true">
                <svg aria-hidden="true" viewBox="0 0 20 20"><rect x="2.5" y="3" width="15" height="10.5" rx="1.6"></rect><path d="M7.3 17h5.4M10 13.5V17"></path></svg>
              </button>
              <button class="preference-button" type="button" data-theme-option="dark" aria-label="深色" title="深色" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 20 20"><path d="M16.8 12.2A7.2 7.2 0 0 1 7.8 3.1a7.3 7.3 0 1 0 9 9.1Z"></path></svg>
              </button>
            </div>
            <div class="preference-segments" role="group" aria-label="标价货币">
              <button class="preference-button currency-button is-active" type="button" data-currency="cny" aria-label="人民币" title="按人民币汇率中间价换算" aria-pressed="true">¥</button>
              <button class="preference-button currency-button" type="button" data-currency="usd" aria-label="美元" title="models.dev 原始美元标价" aria-pressed="false">$</button>
            </div>
          </div>
          <p class="source-note">资料来自 <span>models.dev</span><span class="note-dot">·</span><span>价格为每百万 token 的输入 / 输出</span><span class="note-dot" id="rate-dot" hidden>·</span><span id="rate-note" hidden></span><span class="note-dot">·</span>快照日期：<time id="snapshot-date">—</time></p>
        </div>
      </header>

      <section class="toolbar" aria-label="模型筛选与排序">
        <label class="search-box">
          <svg aria-hidden="true" viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.8"></circle><path d="m13.2 13.2 4 4"></path></svg>
          <input id="search" type="search" placeholder="搜索名称、ID、描述或厂商" autocomplete="off">
          <kbd>/</kbd>
        </label>

        <div class="filter-row">
          <div class="segments" role="group" aria-label="按种类筛选">
            <button type="button" class="segment is-active" data-category="all" aria-pressed="true">全部</button>
            <button type="button" class="segment" data-category="chat" aria-pressed="false">对话</button>
            <button type="button" class="segment" data-category="image" aria-pressed="false">图像</button>
            <button type="button" class="segment" data-category="video" aria-pressed="false">视频</button>
            <button type="button" class="segment" data-category="speech" aria-pressed="false">语音</button>
            <button type="button" class="segment" data-category="transcription" aria-pressed="false">转写</button>
            <button type="button" class="segment" data-category="embedding" aria-pressed="false">嵌入</button>
            <button type="button" class="segment" data-category="rerank" aria-pressed="false">重排序</button>
          </div>
          <div class="select-group">
            <div class="select-control">
              <span class="select-label" id="lab-filter-label">厂商</span>
              <div class="custom-dropdown">
                <button id="lab-filter" class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="lab-filter-menu" aria-labelledby="lab-filter-label lab-filter-value">
                  <span id="lab-filter-value" class="custom-select-value">全部厂商</span>
                  <svg aria-hidden="true" viewBox="0 0 12 12"><path d="m2 4.5 4 4 4-4"></path></svg>
                </button>
                <div id="lab-filter-menu" class="dropdown-menu" role="listbox" aria-labelledby="lab-filter-label" hidden></div>
              </div>
            </div>
            <div class="select-control sort-control">
              <span class="select-label" id="sort-order-label">排序</span>
              <div class="custom-dropdown">
                <button id="sort-order" class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-order-menu" aria-labelledby="sort-order-label sort-order-value">
                  <span id="sort-order-value" class="custom-select-value">最新发布</span>
                  <svg aria-hidden="true" viewBox="0 0 12 12"><path d="m2 4.5 4 4 4-4"></path></svg>
                </button>
                <div id="sort-order-menu" class="dropdown-menu" role="listbox" aria-labelledby="sort-order-label" hidden></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="list-summary">
        <p id="result-count" aria-live="polite"></p>
        <span class="list-hint">选择一张卡片查看详情</span>
      </div>
      <section id="model-list" class="model-list" aria-label="模型列表"></section>
      <p id="empty-state" class="empty-state" hidden>没有找到符合条件的模型。</p>
      <div class="list-footer"><button id="load-more" class="load-more" type="button" hidden>继续显示</button></div>
    </main>
  </body>
</html>
